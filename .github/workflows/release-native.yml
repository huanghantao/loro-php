name: Release native libraries

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.90.0

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            library: libloro_php.so
          - platform: linux-arm64
            os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            library: libloro_php.so
          - platform: darwin-x64
            os: macos-13
            target: x86_64-apple-darwin
            library: libloro_php.dylib
          - platform: darwin-arm64
            os: macos-13
            target: aarch64-apple-darwin
            library: libloro_php.dylib
          - platform: windows-x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            library: loro_php.dll

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"
          rustup target add "${{ matrix.target }}"

      - name: Install Linux ARM64 linker
        if: matrix.platform == 'linux-arm64'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "${GITHUB_ENV}"

      - name: Build native library
        shell: bash
        run: |
          cargo build \
            --manifest-path rust/Cargo.toml \
            --release \
            --target "${{ matrix.target }}"

      - name: Package native library
        shell: bash
        run: |
          package="loro-php-native-${{ matrix.platform }}.tar.gz"
          mkdir -p "dist/native/${{ matrix.platform }}"
          cp "rust/target/${{ matrix.target }}/release/${{ matrix.library }}" \
            "dist/native/${{ matrix.platform }}/${{ matrix.library }}"
          tar -czf "${package}" -C dist "native/${{ matrix.platform }}/${{ matrix.library }}"

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: loro-php-native-${{ matrix.platform }}
          path: loro-php-native-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  release:
    name: Upload release assets
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
