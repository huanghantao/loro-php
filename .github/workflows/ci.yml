name: CI

on:
  pull_request:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.90.0

jobs:
  test:
    name: PHP ${{ matrix.php }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            php: '8.1'
            library: libloro_php.so
          - os: ubuntu-latest
            php: '8.3'
            library: libloro_php.so
          - os: macos-latest
            php: '8.3'
            library: libloro_php.dylib

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi
          coverage: none
          tools: composer:v2

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress

      - name: Build native library
        run: cargo build --manifest-path rust/Cargo.toml --release --locked

      - name: Run PHPUnit
        env:
          LORO_PHP_LIBRARY: ${{ github.workspace }}/rust/target/release/${{ matrix.library }}
        run: composer test
